name: Deploy vinyl website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'jays_vinyl_recovered_site/**'
      - 'scripts/recover_artwork.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate JavaScript before publishing
        run: node --check jays_vinyl_recovered_site/app.js
      - name: Validate artwork recovery script
        run: python3 -m py_compile scripts/recover_artwork.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install artwork image converter
        run: python3 -m pip install --quiet Pillow
      - name: Recover official-store artwork where available
        run: python3 scripts/recover_artwork.py
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
